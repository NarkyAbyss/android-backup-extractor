buildscript {
  repositories {
    gradlePluginPortal()
  }
  dependencies {
    classpath 'com.gradleup.shadow:com.gradleup.shadow.gradle.plugin:8.3.0'
  }
}

apply plugin: 'com.gradleup.shadow'

apply plugin: 'java'


repositories {
    mavenCentral()
}

dependencies {
	compile 'org.bouncycastle:bcprov-jdk18on:1.82'
}

sourceSets {
    main {
        java {
            srcDir 'src'
        }
    }
}

shadowJar {
	baseName = "abe"
}

jar {
	manifest {
        attributes("Main-Class": "org.nick.abe.Main")
    }
}

defaultTasks 'shadowJar'
