buildscript {
  repositories {
    gradlePluginPortal()
  }
  dependencies {
    classpath("com.gradleup.shadow:com.gradleup.shadow.gradle.plugin:8.3.0")
  }
}

apply(plugin = "com.gradleup.shadow")

apply plugin: 'java'


repositories {
    mavenCentral()
}

dependencies {
	compile 'org.bouncycastle:bcprov-jdk15on:1.51'
}

sourceSets {
    main {
        java {
            srcDir 'src'
        }
    }
}

shadowJar {
	baseName = "abe"
}

jar {
	manifest {
        attributes("Main-Class": "org.nick.abe.Main")
    }
}

defaultTasks 'shadowJar'
